<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCS Animated Logo Loader Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="template/animations.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0f19;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            margin: 0;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .preview-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .controls {
            margin-top: 2.5rem;
            display: flex;
            gap: 12px;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="preview-card">
        <h4 class="fw-bold mb-1" style="background: linear-gradient(135deg, #00e5ff, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">BCS Enterprise POS</h4>
        <p class="text-muted small mb-4">Official Universal Animated Logo & Loader Component</p>

        <!-- The Custom Animated Logo Loader -->
        <div class="bcs-loader-container my-4">
            <div class="bcs-logo-container anim-laser">
                <img src="template/bcs-loader.svg" alt="BCS Animated Logo Loader" class="bcs-logo-svg" />
            </div>
            <div class="bcs-loader-text mt-3" id="demoLoaderText">Synchronizing Omnichannel Database...</div>
        </div>

        <div class="controls">
            <button class="btn btn-primary px-4 py-2" onclick="testOverlayLoader()">
                <i class="bi bi-play-circle me-1"></i> Test Fullscreen Overlay Loader
            </button>
        </div>
    </div>

    <!-- Script to include layout helpers -->
    <script src="template/layout.js"></script>
    <script>
        function testOverlayLoader() {
            if (window.showBcsLoader) {
                window.showBcsLoader("Processing High-Speed Checkout...");
                setTimeout(() => {
                    if (window.hideBcsLoader) window.hideBcsLoader();
                }, 3500);
            }
        }
    </script>
</body>
</html>
