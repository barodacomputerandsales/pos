<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | BCS Enterprise POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bs-primary: #6366f1;
            --glass-bg: rgba(30, 30, 30, 0.55);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --page-bg: #111827;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--page-bg) !important;
            min-height: 100vh;
        }

        .main-content {
            margin-left: 240px;
            padding-top: 92px;
            padding-left: 2rem;
            padding-right: 2rem;
            padding-bottom: 2rem;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--glass-shadow);
            transition: transform 0.2s;
            height: 100%;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
        }

        .skeleton-text {
            height: 2rem;
            width: 50%;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body style="background-color: #212529;">
    <script>
        if (localStorage.getItem('isAuthenticated') !== 'true' || !localStorage.getItem('sessionId') || !localStorage.getItem('sessionPort')) {
            window.location.href = 'index.html';
        }
    </script>

    <script src="template/layout.js"></script>
    <script>
        renderTopbar();
        renderSidebar('dashboard');
    </script>

    <main class="main-content">
        <h3 class="mb-4 fw-bold">Overview Dashboard</h3>
        
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="text-muted mb-1 small fw-semibold text-uppercase">Total Products</p>
                            <h2 class="fw-bold mb-0" id="totalProducts">
                                <div class="skeleton skeleton-text"></div>
                            </h2>
                        </div>
                        <div class="stat-icon" style="background: linear-gradient(135deg, #6366f1, #a855f7);">
                            <i class="bi bi-box-seam"></i>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="text-muted mb-1 small fw-semibold text-uppercase">Total Customers</p>
                            <h2 class="fw-bold mb-0" id="totalCustomers">
                                <div class="skeleton skeleton-text"></div>
                            </h2>
                        </div>
                        <div class="stat-icon" style="background: linear-gradient(135deg, #10b981, #059669);">
                            <i class="bi bi-people"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="stat-card">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="text-muted mb-1 small fw-semibold text-uppercase">Total Sales</p>
                            <h2 class="fw-bold mb-0" id="totalSales">
                                <div class="skeleton skeleton-text"></div>
                            </h2>
                        </div>
                        <div class="stat-icon" style="background: linear-gradient(135deg, #f59e0b, #d97706);">
                            <i class="bi bi-cart-check"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="stat-card">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="text-muted mb-1 small fw-semibold text-uppercase">System Users</p>
                            <h2 class="fw-bold mb-0" id="totalUsers">
                                <div class="skeleton skeleton-text"></div>
                            </h2>
                        </div>
                        <div class="stat-icon" style="background: linear-gradient(135deg, #ef4444, #dc2626);">
                            <i class="bi bi-person-badge"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="stat-card">
                    <h5 class="fw-bold mb-3">Recent Products</h5>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover mb-0" style="background: transparent;">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Stock</th>
                                </tr>
                            </thead>
                            <tbody id="recentProductsTable">
                                <tr><td colspan="4">Loading data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="stat-card">
                    <h5 class="fw-bold mb-3">Quick Actions</h5>
                    <div class="d-flex flex-column gap-2">
                        <button class="btn btn-primary text-start"><i class="bi bi-plus-circle me-2"></i> Add New Product</button>
                        <button class="btn btn-success text-start"><i class="bi bi-cart-plus me-2"></i> Start New Sale</button>
                        <button class="btn btn-info text-start text-white"><i class="bi bi-person-plus me-2"></i> Add Customer</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { getCollection } from './script/api.js';
        import { logoutUser } from './script/auth.js';
        window.logoutUser = logoutUser;

        async function loadDashboardData() {
            try {
                // Fetch data in parallel for maximum speed!
                const [productsRes, customersRes, salesRes, usersRes] = await Promise.all([
                    getCollection('products').catch(() => ({ docs: [] })),
                    getCollection('customers').catch(() => ({ docs: [] })),
                    getCollection('sales').catch(() => ({ docs: [] })),
                    getCollection('users').catch(() => ({ docs: [] }))
                ]);

                const products = productsRes.docs.map(d => {
                    const data = d.data();
                    return {
                        ...data,
                        buyPrice: data.buyPrice || data.buy_price || 0,
                        sellPrice: data.sellPrice || data.sell_price || 0,
                        wholesalePrice: data.wholesalePrice || data.wholesale_price || 0
                    };
                }).filter(p => !p.deleteScheduledAt);
                const customers = customersRes.docs.map(d => d.data());
                const sales = salesRes.docs.map(d => d.data());
                const users = usersRes.docs.map(d => d.data());

                // Update Overview Cards
                document.getElementById('totalProducts').textContent = products.length;
                document.getElementById('totalCustomers').textContent = customers.length;
                document.getElementById('totalSales').textContent = sales.length;
                document.getElementById('totalUsers').textContent = users.length;

                // Update Recent Products Table
                const tbody = document.getElementById('recentProductsTable');
                if (products.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No products found in database.</td></tr>';
                } else {
                    const recentProducts = products.slice(-5).reverse(); // Just take the last 5 for now
                    tbody.innerHTML = recentProducts.map(p => `
                        <tr>
                            <td>${p.name || 'N/A'}</td>
                            <td>${p.category || 'N/A'}</td>
                            <td>৳${p.sellPrice || p.priceTiers?.pcs?.sell || 0}</td>
                            <td>
                                <span class="badge ${p.quantity > 0 ? 'bg-success' : 'bg-danger'}">${p.quantity || 0}</span>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (error) {
                console.error("Failed to load dashboard data", error);
                document.getElementById('recentProductsTable').innerHTML = `<tr><td colspan="4" class="text-danger">Error loading data: ${error.message}</td></tr>`;
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadDashboardData);
    </script>
</body>
</html>
