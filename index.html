<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>

    <script>
        if (localStorage.getItem("isAuthenticated") === "true" && localStorage.getItem("sessionId") && localStorage.getItem("sessionPort")) {
            window.location.replace("dashboard.html");
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BCS Enterprise POS</title>
    <link rel="icon" href="al.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="template/animations.css">
    
    
    <!-- Prevent nodeIntegration from breaking UMD bundles -->
    <script>
        if (typeof module === "object") {
            window.module = module;
            module = undefined;
        }
    </script>
    <!-- Load Argon2 for browser to compute hashes based on salt -->
    <script src="script/argon2-bundled.min.js"></script>
    <script>
        if (window.module) module = window.module;
    </script>


    <style>
        :root {
            --bs-primary: #6366f1;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: 1px solid rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --glass-blur: blur(16px);
            --page-bg: #f3f4f6;
            --orb-1: rgba(99, 102, 241, 0.4);
            --orb-2: rgba(168, 85, 247, 0.3);
        }

        [data-bs-theme="dark"] {
            --glass-bg: rgba(30, 30, 30, 0.55);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --page-bg: #111827;
            --orb-1: rgba(99, 102, 241, 0.2);
            --orb-2: rgba(168, 85, 247, 0.2);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--page-bg) !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 0;
            overflow: hidden;
        }

        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            z-index: -1;
            /* filter removed for performance */
            pointer-events: none;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--orb-1) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            
        }

        body::after {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--orb-2) 0%, transparent 70%);
            bottom: -50px;
            right: -50px;
            
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(20px) scale(1.05); }
            100% { transform: translateY(0px) scale(1); }
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 24px;
            padding: 3rem 2rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
            animation: bcsCardReveal 480ms var(--bcs-ease-out-expo) forwards;
        }

        .login-card .form-control {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--bs-body-color);
            transition: all 0.3s ease;
        }

        [data-bs-theme="dark"] .login-card .form-control {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-card .form-control:focus {
            background: var(--glass-bg);
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
            border-color: var(--bs-primary);
            outline: none;
        }

        .btn-login {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-login:disabled {
            background: #9ca3af;
            transform: none;
            box-shadow: none;
        }

        /* Loading Spinner */
        .spinner-border {
            width: 1.2rem;
            height: 1.2rem;
            border-width: 0.15em;
        }
    </style>
</head>
<body style="background-color: #212529;">

    <div class="login-card">
        <img src="al.png" alt="Logo" style="width: 80px; height: 80px; object-fit: contain; margin-bottom: 1.5rem;" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'80\' height=\'80\' viewBox=\'0 0 16 16\' fill=\'%236366f1\'><path d=\'M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z\'/></svg>'">
        
        <h3 class="fw-bold mb-4">Welcome Back</h3>
        
        <div id="errorMessage" class="alert alert-danger d-none" style="border-radius: 12px; font-size: 0.9rem;"></div>

        <form id="loginForm">
            <div class="mb-3 text-start">
                <label class="form-label small fw-semibold text-muted ms-1">Username</label>
                <div class="input-group">
                    <span class="input-group-text border-0" style="background: rgba(150,150,150,0.1); border-radius: 12px 0 0 12px;"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control border-start-0" id="username" required autocomplete="username" style="border-radius: 0 12px 12px 0;">
                </div>
            </div>
            
            <div class="mb-3 text-start">
                <label class="form-label small fw-semibold text-muted ms-1">Password</label>
                <div class="input-group">
                    <span class="input-group-text border-0" style="background: rgba(150,150,150,0.1); border-radius: 12px 0 0 12px;"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" required autocomplete="current-password" style="border-radius: 0 12px 12px 0;">
                </div>
            </div>

            <div class="mb-4 text-start">
                <label class="form-label small fw-semibold text-muted ms-1">Security PIN (Optional)</label>
                <div class="input-group">
                    <span class="input-group-text border-0" style="background: rgba(150,150,150,0.1); border-radius: 12px 0 0 12px;"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="pin" autocomplete="off" style="border-radius: 0 12px 12px 0;">
                </div>
            </div>

            <button type="submit" class="btn btn-login w-100" id="loginBtn">
                <span id="btnText">Sign In</span>
                <div class="spinner-border text-light d-none" id="btnSpinner" role="status"></div>
            </button>
        </form>
    </div>

    
    <script type="module">
        import { loginUser } from "./script/auth.js";

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value;
            const pin = document.getElementById("pin").value;
            
            const btn = document.getElementById("loginBtn");
            const text = document.getElementById("btnText");
            const spinner = document.getElementById("btnSpinner");
            const errBox = document.getElementById("errorMessage");

            btn.disabled = true;
            text.classList.add("d-none");
            spinner.classList.remove("d-none");
            errBox.classList.add("d-none");

            try {
                await loginUser(user, pass, pin);
                window.location.href = "dashboard.html";
            } catch (error) {
                // Fallback for local testing if DB is empty
                if (user === "admin" && pass === "123456") {
                    localStorage.setItem("isAuthenticated", "true");
                    localStorage.setItem("loggedInUserId", "admin");
                    localStorage.setItem("userRole", "admin");
                    window.location.href = "dashboard.html";
                } else {
                    errBox.textContent = error.message;
                    errBox.classList.remove("d-none");
                }
            } finally {
                btn.disabled = false;
                text.classList.remove("d-none");
                spinner.classList.add("d-none");
            }
        });
    </script>
</body>

</html>
