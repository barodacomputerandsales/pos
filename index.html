<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <script>
        if (localStorage.getItem("isAuthenticated") === "true" && localStorage.getItem("sessionId") && localStorage.getItem("sessionPort")) {
            window.location.replace("dashboard.html");
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | BCS Enterprise POS</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" href="assets/icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="template/animations.css">

    <!-- Prevent nodeIntegration from breaking UMD bundles -->
    <script>
        if (typeof module === "object") {
            window.module = module;
            module = undefined;
        }
    </script>
    <script src="script/argon2-bundled.min.js"></script>
    <script>
        if (window.module) module = window.module;
    </script>

    <style>
        :root {
            --bs-primary: #6366f1;
            --brand-cyan: #00f0ff;
            --brand-indigo: #6366f1;
            --brand-violet: #a855f7;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: var(--font-main);
            background: #06080f !important;
            min-height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            color: #f8fafc;
        }

        /* Interactive Particle & Star Canvas */
        #bgCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Ambient Glowing Spotlights */
        .ambient-spotlight {
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.65;
        }

        .spotlight-top {
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.22) 0%, rgba(99, 102, 241, 0.12) 50%, transparent 75%);
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
        }

        .spotlight-bottom-left {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.2) 0%, transparent 70%);
            bottom: -150px;
            left: -100px;
        }

        .spotlight-bottom-right {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.18) 0%, transparent 70%);
            bottom: -150px;
            right: -100px;
        }

        /* Glowing Hologram Card Container */
        .login-hologram-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 24px;
        }

        .login-hologram-card {
            background: rgba(14, 18, 30, 0.72);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 3rem 2.6rem;
            box-shadow: 
                0 30px 90px rgba(0, 0, 0, 0.7),
                0 0 50px rgba(0, 240, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Top Border Laser Highlight */
        .login-hologram-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f0ff, #6366f1, transparent);
            box-shadow: 0 0 16px #00f0ff;
        }

        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: translateY(24px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo Emblem Box */
        .emblem-wrapper {
            margin-bottom: 1.5rem;
            position: relative;
            display: inline-block;
        }

        .emblem-glow-ring {
            position: absolute;
            inset: -8px;
            border-radius: 26px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.5), rgba(99, 102, 241, 0.5));
            filter: blur(14px);
            opacity: 0.6;
            animation: pulseEmblem 4s ease-in-out infinite alternate;
        }

        @keyframes pulseEmblem {
            0% { opacity: 0.4; transform: scale(0.95); }
            100% { opacity: 0.8; transform: scale(1.05); }
        }

        .emblem-box {
            position: relative;
            width: 82px;
            height: 82px;
            border-radius: 22px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .emblem-box:hover {
            transform: scale(1.08) rotate(-3deg);
        }

        .emblem-box img {
            width: 62px;
            height: 62px;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.4));
        }

        /* Typography */
        .brand-name {
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ffffff 30%, #00f0ff 70%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            color: #94a3b8;
            font-size: 0.88rem;
            margin-bottom: 1.25rem;
        }

        .terminal-version-tag {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.25);
            color: #00f0ff;
            padding: 4px 12px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2rem;
        }

        /* Form Controls */
        .input-group-custom {
            position: relative;
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .input-group-custom label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #94a3b8;
            margin-bottom: 7px;
        }

        .custom-input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .custom-input-box i.input-icon {
            position: absolute;
            left: 16px;
            color: #64748b;
            font-size: 1.15rem;
            pointer-events: none;
            transition: color 0.25s ease;
        }

        .custom-input-box input {
            width: 100%;
            background: rgba(10, 14, 26, 0.75) !important;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            border-radius: 14px;
            padding: 13px 16px 13px 48px;
            font-size: 0.95rem;
            color: #ffffff !important;
            font-family: var(--font-main);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: text;
        }

        .custom-input-box input:focus {
            background: rgba(15, 22, 40, 0.95) !important;
            border-color: #00f0ff !important;
            box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.22), 0 0 25px rgba(99, 102, 241, 0.25) !important;
            outline: none;
        }

        .custom-input-box input::placeholder {
            color: rgba(148, 163, 184, 0.4);
            font-size: 0.9rem;
        }

        .custom-input-box:focus-within i.input-icon {
            color: #00f0ff;
        }

        .eye-toggle-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .eye-toggle-btn:hover {
            color: #00f0ff;
        }

        /* Caps Lock Badge */
        .caps-warning {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: #fbbf24;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Sign In Button */
        .btn-master-signin {
            width: 100%;
            background: linear-gradient(135deg, #00f0ff 0%, #6366f1 50%, #a855f7 100%);
            background-size: 200% 200%;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-master-signin:hover {
            background-position: 100% 100%;
            transform: translateY(-2px);
            box-shadow: 0 14px 40px rgba(0, 240, 255, 0.5);
            color: #ffffff;
        }

        .btn-master-signin:active {
            transform: translateY(1px);
        }

        .btn-master-signin:disabled {
            background: #334155 !important;
            color: #94a3b8 !important;
            transform: none !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }

        /* 1-Click Demo Fill Badge */
        .demo-fill-pill {
            margin-top: 1.5rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 0.8rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .demo-fill-pill:hover {
            background: rgba(0, 240, 255, 0.08);
            border-color: #00f0ff;
            color: #e2e8f0;
        }

        /* Shake Alert */
        .shake-alert-box {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: 12px;
            padding: 11px 16px;
            font-size: 0.86rem;
            color: #fca5a5;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.25rem;
            text-align: left;
            animation: shakeAlert 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shakeAlert {
            10%, 90% { transform: translateX(-1px); }
            20%, 80% { transform: translateX(2px); }
            30%, 50%, 70% { transform: translateX(-4px); }
            40%, 60% { transform: translateX(4px); }
        }

        /* Footer Telemetry Row */
        .footer-telemetry {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: #64748b;
        }

        .pulse-live-dot {
            width: 7px;
            height: 7px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #10b981;
            animation: pulseGlowDot 2s infinite;
        }

        @keyframes pulseGlowDot {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>
    <!-- Interactive Particle Background -->
    <canvas id="bgCanvas"></canvas>

    <!-- Ambient Glowing Spotlights -->
    <div class="ambient-spotlight spotlight-top"></div>
    <div class="ambient-spotlight spotlight-bottom-left"></div>
    <div class="ambient-spotlight spotlight-bottom-right"></div>

    <!-- Layout Engine Scripts (Loads showBcsLoader / hideBcsLoader & Animations) -->
    <script src="template/layout.js"></script>

    <!-- Centered Hologram Authentication Card -->
    <div class="login-hologram-wrapper">
        <div class="login-hologram-card text-center">
            
            <!-- 3D Squircle Logo Emblem -->
            <div class="emblem-wrapper">
                <div class="emblem-glow-ring"></div>
                <div class="emblem-box">
                    <img src="assets/icon.png" onerror="this.src='template/bcs-logo.svg'" alt="BCS">
                </div>
            </div>

            <!-- Brand Header -->
            <h1 class="brand-name">BCS Enterprise POS</h1>
            <p class="brand-subtitle">Baroda Computers And Sales</p>

            <div class="terminal-version-tag">
                <span class="pulse-live-dot"></span>
                <span>TERMINAL ACTIVE • v1.9.5</span>
            </div>

            <!-- Error Shake Alert Container -->
            <div id="loginErrorBox" class="shake-alert-box d-none">
                <i class="bi bi-exclamation-octagon-fill text-danger fs-5"></i>
                <span id="loginErrorMessage">Invalid username or password.</span>
            </div>

            <!-- Authentication Form -->
            <form id="hologramLoginForm" autocomplete="on">
                <!-- Username / Operator -->
                <div class="input-group-custom">
                    <label for="inputUsername">Operator Identifier</label>
                    <div class="custom-input-box">
                        <i class="bi bi-person-circle input-icon"></i>
                        <input type="text" id="inputUsername" placeholder="Enter operator username (e.g. admin)" required autocomplete="username" autofocus>
                    </div>
                </div>

                <!-- Password with Show/Hide Toggle -->
                <div class="input-group-custom">
                    <label for="inputPassword">Terminal Password</label>
                    <div class="custom-input-box">
                        <i class="bi bi-shield-lock-fill input-icon"></i>
                        <input type="password" id="inputPassword" placeholder="Enter password" required autocomplete="current-password" style="padding-right: 48px;">
                        <button type="button" class="eye-toggle-btn" id="togglePasswordBtn" title="Show/Hide Password">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                    <div id="capsLockIndicator" class="caps-warning d-none">
                        <i class="bi bi-capslock-fill"></i> CAPS LOCK IS ON
                    </div>
                </div>

                <!-- Security PIN (Optional) -->
                <div class="input-group-custom">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="inputPin" class="mb-0">Security Token / PIN</label>
                        <span class="text-muted" style="font-size: 0.72rem;">(Optional)</span>
                    </div>
                    <div class="custom-input-box">
                        <i class="bi bi-key-fill input-icon"></i>
                        <input type="password" id="inputPin" placeholder="Optional security PIN" autocomplete="off">
                    </div>
                </div>

                <!-- Sign In Button -->
                <button type="submit" class="btn-master-signin" id="btnSubmitLogin">
                    <i class="bi bi-box-arrow-in-right fs-5" id="btnSubmitIcon"></i>
                    <span id="btnSubmitText">Unlock Terminal</span>
                </button>
            </form>

            <!-- 1-Click Demo Credential Auto-Fill -->
            <div class="demo-fill-pill" id="demoFillPill" title="Click to fill default admin credentials">
                <span>Default: <strong>admin / 123456</strong></span>
                <span class="badge bg-secondary bg-opacity-25 text-info">1-Click Auto-Fill</span>
            </div>

            <!-- Footer Telemetry -->
            <div class="footer-telemetry">
                <div class="d-flex align-items-center gap-2">
                    <span class="pulse-live-dot"></span>
                    <span>D1 Serverless Online</span>
                </div>
                <span>Argon2id TLS 1.3</span>
            </div>
        </div>
    </div>

    <!-- Interactive Particle Background Canvas Script -->
    <script>
        (function() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const PARTICLE_COUNT = 45;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    radius: Math.random() * 2 + 0.8,
                    color: Math.random() > 0.5 ? 'rgba(0, 240, 255, ' : 'rgba(99, 102, 241, ',
                    alpha: Math.random() * 0.4 + 0.15
                });
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);

                // Draw connecting micro-lines
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 130) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(0, 240, 255, ${0.12 * (1 - dist / 130)})`;
                            ctx.lineWidth = 0.7;
                            ctx.stroke();
                        }
                    }
                }

                // Draw and update particles
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0) p.x = width;
                    if (p.x > width) p.x = 0;
                    if (p.y < 0) p.y = height;
                    if (p.y > height) p.y = 0;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color + p.alpha + ')';
                    ctx.fill();
                });

                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>

    <!-- Terminal Authentication Logic -->
    <script type="module">
        import { loginUser } from "./script/auth.js";

        // Password Show/Hide Toggle
        const passwordInput = document.getElementById("inputPassword");
        const toggleBtn = document.getElementById("togglePasswordBtn");
        const eyeIcon = document.getElementById("eyeIcon");

        toggleBtn.addEventListener("click", () => {
            const isPassword = passwordInput.getAttribute("type") === "password";
            passwordInput.setAttribute("type", isPassword ? "text" : "password");
            eyeIcon.className = isPassword ? "bi bi-eye-slash text-info" : "bi bi-eye";
        });

        // Caps Lock Indicator
        const capsLockBadge = document.getElementById("capsLockIndicator");
        passwordInput.addEventListener("keyup", (e) => {
            if (e.getModifierState && e.getModifierState("CapsLock")) {
                capsLockBadge.classList.remove("d-none");
            } else {
                capsLockBadge.classList.add("d-none");
            }
        });

        // 1-Click Auto Fill
        document.getElementById("demoFillPill").addEventListener("click", () => {
            document.getElementById("inputUsername").value = "admin";
            document.getElementById("inputPassword").value = "123456";
            document.getElementById("inputPassword").focus();
        });

        // Form Submit Handler
        document.getElementById("hologramLoginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const user = document.getElementById("inputUsername").value.trim();
            const pass = document.getElementById("inputPassword").value;
            const pin = document.getElementById("inputPin").value.trim();

            const btn = document.getElementById("btnSubmitLogin");
            const btnText = document.getElementById("btnSubmitText");
            const btnIcon = document.getElementById("btnSubmitIcon");
            const errorBox = document.getElementById("loginErrorBox");
            const errorMsg = document.getElementById("loginErrorMessage");

            btn.disabled = true;
            btnText.textContent = "Verifying Handshake...";
            btnIcon.className = "spinner-border spinner-border-sm";
            errorBox.classList.add("d-none");

            // Trigger Custom BCS Animated Neon Laser Loader
            if (window.showBcsLoader) {
                window.showBcsLoader("Authenticating Credentials with Cloudflare D1...");
            }

            try {
                const loginData = await loginUser(user, pass, pin);
                localStorage.setItem("loggedInUserName", user);

                if (window.showBcsLoader) {
                    window.showBcsLoader("Handshake Verified! Launching POS Dashboard...");
                }

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 600);

            } catch (error) {
                // Emergency Offline / Local Administrator Fallback
                if (user === "admin" && pass === "123456") {
                    localStorage.setItem("isAuthenticated", "true");
                    localStorage.setItem("loggedInUserId", "admin");
                    localStorage.setItem("loggedInUserName", "Admin");
                    localStorage.setItem("userRole", "administrator");
                    localStorage.setItem("sessionId", "admin-session-local");
                    localStorage.setItem("sessionPort", "8080");

                    if (window.showBcsLoader) {
                        window.showBcsLoader("Offline Mode Granted. Launching Dashboard...");
                    }

                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 600);
                } else {
                    if (window.hideBcsLoader) {
                        window.hideBcsLoader();
                    }
                    errorMsg.textContent = error.message || "Invalid operator username or password.";
                    errorBox.classList.remove("d-none");
                    btn.disabled = false;
                    btnText.textContent = "Unlock Terminal";
                    btnIcon.className = "bi bi-box-arrow-in-right fs-5";
                }
            }
        });
    </script>
</body>
</html>
