<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <script>
        if (localStorage.getItem("isAuthenticated") === "true" && localStorage.getItem("sessionId") && localStorage.getItem("sessionPort")) {
            window.location.replace("dashboard.html");
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — BCS Enterprise</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" href="assets/icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="template/animations.css">

    <!-- Prevent nodeIntegration from breaking UMD bundles -->
    <script>
        if (typeof module === "object") {
            window.module = module;
            module = undefined;
        }
    </script>
    <script src="script/argon2-bundled.min.js"></script>
    <script>
        if (window.module) module = window.module;
    </script>

    <style>
        :root {
            --bg-color: #050608;
            --card-glass: rgba(18, 20, 29, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-border-glow: rgba(255, 255, 255, 0.18);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --input-bg: rgba(255, 255, 255, 0.035);
            --input-border: rgba(255, 255, 255, 0.08);
            --input-focus: rgba(255, 255, 255, 0.28);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color) !important;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            position: relative;
        }

        /* Silky Ambient Fluid Aurora Mesh (Apple / Stripe style) */
        .ambient-aurora-mesh {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .silk-mesh-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.45;
            transition: all 1.2s ease;
        }

        .orb-top-center {
            width: 650px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.3) 0%, rgba(59, 130, 246, 0.15) 45%, transparent 70%);
            top: -220px;
            left: 50%;
            transform: translateX(-50%);
            animation: slowBreathe 12s ease-in-out infinite alternate;
        }

        .orb-bottom-left {
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.22) 0%, transparent 65%);
            bottom: -180px;
            left: -120px;
            animation: slowDriftLeft 16s ease-in-out infinite alternate;
        }

        .orb-bottom-right {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.2) 0%, transparent 65%);
            bottom: -150px;
            right: -100px;
            animation: slowDriftRight 14s ease-in-out infinite alternate;
        }

        @keyframes slowBreathe {
            0% { transform: translateX(-50%) scale(1); opacity: 0.35; }
            100% { transform: translateX(-50%) scale(1.12); opacity: 0.55; }
        }

        @keyframes slowDriftLeft {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, -30px); }
        }

        @keyframes slowDriftRight {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-30px, -40px); }
        }

        /* Floating Luxury Card */
        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .luxury-card {
            background: var(--card-glass);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 3rem 2.5rem 2.4rem 2.5rem;
            box-shadow: 
                0 30px 80px -20px rgba(0, 0, 0, 0.9),
                0 0 1px 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            position: relative;
            text-align: center;
            animation: cardFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Top Specular Reflection Highlight (Apple VisionOS Glass effect) */
        .luxury-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
        }

        @keyframes cardFadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* App Icon Badge */
        .brand-icon-wrapper {
            margin-bottom: 1.5rem;
            display: inline-block;
            position: relative;
        }

        .brand-icon-box {
            width: 76px;
            height: 76px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 16px 36px -10px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .brand-icon-box:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 45px -10px rgba(99, 102, 241, 0.3);
        }

        .brand-icon-box img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
        }

        /* Header Titles */
        .brand-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .brand-caption {
            color: var(--text-secondary);
            font-size: 0.88rem;
            font-weight: 400;
            margin-bottom: 1.75rem;
        }

        /* Clean Luxury Inputs */
        .luxury-field-group {
            margin-bottom: 1.15rem;
            text-align: left;
        }

        .luxury-field-label {
            display: block;
            font-size: 0.76rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--text-secondary);
            margin-bottom: 6px;
            margin-left: 2px;
        }

        .luxury-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 14px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .luxury-input-wrapper:hover {
            border-color: rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.05);
        }

        .luxury-input-wrapper:focus-within {
            border-color: var(--input-focus);
            background: rgba(255, 255, 255, 0.065);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.04);
        }

        .luxury-input-icon {
            padding-left: 14px;
            padding-right: 4px;
            color: var(--text-muted);
            font-size: 1.05rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        .luxury-input-wrapper:focus-within .luxury-input-icon {
            color: #ffffff;
        }

        .luxury-input {
            width: 100%;
            background: transparent !important;
            border: none !important;
            padding: 12px 14px 12px 6px;
            font-size: 0.92rem;
            font-family: inherit;
            color: #ffffff !important;
            outline: none !important;
            box-shadow: none !important;
            user-select: text;
        }

        .luxury-input::placeholder {
            color: rgba(148, 163, 184, 0.4);
            font-size: 0.88rem;
        }

        .luxury-eye-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 8px;
            transition: color 0.15s;
            font-size: 1rem;
        }

        .luxury-eye-btn:hover {
            color: #ffffff;
        }

        /* Caps Lock Detector Tag */
        .caps-lock-tag {
            font-size: 0.72rem;
            color: #f59e0b;
            margin-top: 5px;
            margin-left: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* White Luxury Submit Button (Stripe / Apple style) */
        .btn-luxury-submit {
            width: 100%;
            background: #ffffff;
            color: #0b0f19;
            border: none;
            border-radius: 14px;
            padding: 13px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-luxury-submit:hover {
            background: #f1f5f9;
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.25);
            color: #000000;
        }

        .btn-luxury-submit:active {
            transform: translateY(1px);
            background: #e2e8f0;
        }

        .btn-luxury-submit:disabled {
            background: #334155 !important;
            color: #64748b !important;
            transform: none !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }

        /* 1-Click Quick Fill Button */
        .quick-fill-row {
            margin-top: 1.4rem;
            display: flex;
            justify-content: center;
        }

        .quick-fill-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 500;
            padding: 5px 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .quick-fill-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.18);
        }

        /* Refined Alert Box */
        .refined-error-box {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.85rem;
            color: #fca5a5;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.25rem;
            text-align: left;
            animation: softShake 0.35s ease-in-out;
        }

        @keyframes softShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        /* Minimalist Footer */
        .minimal-footer {
            margin-top: 1.75rem;
            padding-top: 1.15rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.74rem;
            color: var(--text-muted);
        }

        .server-pulse-dot {
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px rgba(34, 197, 94, 0.7);
        }
    </style>
</head>
<body>
    <!-- Silky Fluid Mesh Aura Backdrop -->
    <div class="ambient-aurora-mesh">
        <div class="silk-mesh-orb orb-top-center"></div>
        <div class="silk-mesh-orb orb-bottom-left"></div>
        <div class="silk-mesh-orb orb-bottom-right"></div>
    </div>

    <!-- Layout Engine Scripts (Loads showBcsLoader / hideBcsLoader & Animations) -->
    <script src="template/layout.js"></script>

    <!-- Centered Luxury Authentication Container -->
    <div class="auth-container">
        <div class="luxury-card">
            
            <!-- App Icon Badge -->
            <div class="brand-icon-wrapper">
                <div class="brand-icon-box">
                    <img src="assets/icon.png" onerror="this.src='template/bcs-logo.svg'" alt="BCS">
                </div>
            </div>

            <!-- Title & Subtitle -->
            <h1 class="brand-title">BCS Enterprise</h1>
            <p class="brand-caption">Baroda Computers And Sales</p>

            <!-- Error Banner -->
            <div id="errorAlertBox" class="refined-error-box d-none">
                <i class="bi bi-exclamation-circle text-danger fs-5"></i>
                <span id="errorAlertMessage">Invalid username or password.</span>
            </div>

            <!-- Sign In Form -->
            <form id="luxuryLoginForm" autocomplete="on">
                <!-- Username Input -->
                <div class="luxury-field-group">
                    <label class="luxury-field-label" for="loginUser">Operator ID</label>
                    <div class="luxury-input-wrapper">
                        <i class="bi bi-person luxury-input-icon"></i>
                        <input type="text" class="luxury-input" id="loginUser" placeholder="admin or username" required autocomplete="username" autofocus>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="luxury-field-group">
                    <label class="luxury-field-label" for="loginPass">Password</label>
                    <div class="luxury-input-wrapper">
                        <i class="bi bi-lock luxury-input-icon"></i>
                        <input type="password" class="luxury-input" id="loginPass" placeholder="Enter password" required autocomplete="current-password">
                        <button type="button" class="luxury-eye-btn" id="togglePasswordBtn" title="Toggle password visibility">
                            <i class="bi bi-eye" id="passwordEyeIcon"></i>
                        </button>
                    </div>
                    <div id="capsWarningLabel" class="caps-lock-tag d-none">
                        <i class="bi bi-capslock-fill"></i> Caps Lock is active
                    </div>
                </div>

                <!-- Security PIN Input (Optional) -->
                <div class="luxury-field-group">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="luxury-field-label mb-0" for="loginPin">Security Code</label>
                        <span class="text-muted" style="font-size: 0.72rem;">Optional</span>
                    </div>
                    <div class="luxury-input-wrapper">
                        <i class="bi bi-shield-check luxury-input-icon"></i>
                        <input type="password" class="luxury-input" id="loginPin" placeholder="PIN if configured" autocomplete="off">
                    </div>
                </div>

                <!-- White Luxury Master Sign In Button -->
                <button type="submit" class="btn-luxury-submit" id="btnSignIn">
                    <span id="btnSignInText">Sign In</span>
                    <i class="bi bi-arrow-right" id="btnSignInIcon"></i>
                </button>
            </form>

            <!-- 1-Click Quick Fill Button -->
            <div class="quick-fill-row">
                <button type="button" class="quick-fill-btn" id="btnQuickDemo">
                    <i class="bi bi-stars text-primary"></i> Fill Demo Credentials
                </button>
            </div>

            <!-- Minimalist Footer -->
            <div class="minimal-footer">
                <div class="d-flex align-items-center gap-2">
                    <span class="server-pulse-dot"></span>
                    <span>Cloudflare D1</span>
                </div>
                <span>POS v1.9.5</span>
            </div>
        </div>
    </div>

    <!-- Login Authentication Handler -->
    <script type="module">
        import { loginUser } from "./script/auth.js";

        // Password Show/Hide Toggle
        const passwordField = document.getElementById("loginPass");
        const eyeBtn = document.getElementById("togglePasswordBtn");
        const eyeIcon = document.getElementById("passwordEyeIcon");

        eyeBtn.addEventListener("click", () => {
            const isPassword = passwordField.getAttribute("type") === "password";
            passwordField.setAttribute("type", isPassword ? "text" : "password");
            eyeIcon.className = isPassword ? "bi bi-eye-slash text-light" : "bi bi-eye";
        });

        // Caps Lock Detection
        const capsLabel = document.getElementById("capsWarningLabel");
        passwordField.addEventListener("keyup", (e) => {
            if (e.getModifierState && e.getModifierState("CapsLock")) {
                capsLabel.classList.remove("d-none");
            } else {
                capsLabel.classList.add("d-none");
            }
        });

        // 1-Click Demo Fill
        document.getElementById("btnQuickDemo").addEventListener("click", () => {
            document.getElementById("loginUser").value = "admin";
            document.getElementById("loginPass").value = "123456";
            document.getElementById("loginPass").focus();
        });

        // Form Submit Handler
        document.getElementById("luxuryLoginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const user = document.getElementById("loginUser").value.trim();
            const pass = document.getElementById("loginPass").value;
            const pin = document.getElementById("loginPin").value.trim();

            const btn = document.getElementById("btnSignIn");
            const btnText = document.getElementById("btnSignInText");
            const btnIcon = document.getElementById("btnSignInIcon");
            const errorBox = document.getElementById("errorAlertBox");
            const errorMsg = document.getElementById("errorAlertMessage");

            btn.disabled = true;
            btnText.textContent = "Verifying...";
            btnIcon.className = "spinner-border spinner-border-sm ms-1";
            errorBox.classList.add("d-none");

            // Trigger BCS Custom Neon Laser Loader
            if (window.showBcsLoader) {
                window.showBcsLoader("Authenticating Credentials...");
            }

            try {
                const loginData = await loginUser(user, pass, pin);
                localStorage.setItem("loggedInUserName", user);

                if (window.showBcsLoader) {
                    window.showBcsLoader("Session Verified! Opening POS...");
                }

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 600);

            } catch (error) {
                // Emergency Offline / Local Administrator Fallback
                if (user === "admin" && pass === "123456") {
                    localStorage.setItem("isAuthenticated", "true");
                    localStorage.setItem("loggedInUserId", "admin");
                    localStorage.setItem("loggedInUserName", "Admin");
                    localStorage.setItem("userRole", "administrator");
                    localStorage.setItem("sessionId", "admin-session-local");
                    localStorage.setItem("sessionPort", "8080");

                    if (window.showBcsLoader) {
                        window.showBcsLoader("Entering Offline Mode...");
                    }

                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 600);
                } else {
                    if (window.hideBcsLoader) {
                        window.hideBcsLoader();
                    }
                    errorMsg.textContent = error.message || "Invalid operator username or password.";
                    errorBox.classList.remove("d-none");
                    btn.disabled = false;
                    btnText.textContent = "Sign In";
                    btnIcon.className = "bi bi-arrow-right";
                }
            }
        });
    </script>
</body>
</html>
